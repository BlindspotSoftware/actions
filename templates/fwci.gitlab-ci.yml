# A FirmwareCI job to extend in a .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/BlindspotSoftware/actions/v8/templates/fwci.gitlab-ci.yml
#
#   firmware-test:
#     extends: .fwci
#     variables:
#       FWCI_WORKFLOW: crystal-core
#       FWCI_BINARIES: Binary=build/coreboot.rom
#
# On FirmwareCI, set FWCI_TOKEN as a masked CI/CD variable, and FWCI_ORG when the token reaches more
# than one organization. FWCI_GITLAB_TOKEN is needed only if the project's GitLab integration has no
# token: a project access token with api scope, for FirmwareCI to report back.
#
# On FirmwareCI the job ends once the request is sent, and FirmwareCI reports the results on the
# commit, queued at mid; with FWCI_SYNCED false they show only on FirmwareCI, queued at high. With
# FWCI_FOLLOW, or FWCI_LOCAL true, the job waits for the tests and fails on a failed one, and GitLab
# shows report.xml in the merge request. Without either, fwci writes neither fwci.log nor report.xml,
# and GitLab's warning that it found no files to upload is expected. The image's fwci-ci turns the
# variables into fwci run. A run on the runner needs Docker there: a shell executor with fwci and this
# repository's fwci-ci on the PATH, or a docker executor set up as in the README's GitLab CI section.
.fwci:
  image: firmwareci/action:v8
  variables:
    FWCI_WORKFLOW: ""
    FWCI_TESTS: "" # test names, separated by commas or newlines; all of the workflow's when empty
    FWCI_BINARIES: "" # name=file, or name=URL on FirmwareCI, separated by ; or newlines
    FWCI_LOCAL: "false" # true runs the tests on this runner, next to the board, instead of FirmwareCI
    FWCI_SYNCED: "true" # on FirmwareCI, the tests as synced, reported on the commit; false sends the checkout's
    FWCI_DUT: "" # with FWCI_LOCAL true, the DUT; else the first free one with the workflow's label
    FWCI_FOLLOW: "false" # on FirmwareCI, wait for the tests; a time such as 2h waits at most that long
    FWCI_ARGS: "" # more fwci run arguments, such as --priority low, --wait=30m or --storage OS=images
  script:
    - fwci-ci
  artifacts:
    when: always
    paths: [fwci.log]
    reports:
      junit: report.xml
